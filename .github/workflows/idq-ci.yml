name: CI

# Checks a PR before it goes into idq. The idq ruleset requires all three:
# - docker-build: the Docker image builds (this also type-checks the code);
# - unit-tests: the IDQ unit tests of server and client pass;
# - upstream-files: we only modify the Docmost files listed in
#   .github/idq-upstream-files.txt.
#
# They check the PR merge result, that is idq with the PR merged in. PRs opened
# with GITHUB_TOKEN (Sync upstream without SYNC_TOKEN) don't trigger workflows:
# for those, Sync upstream runs this workflow by hand with the PR number, and
# the results are written as commit statuses with the same names on the PR head.
#
# Actions are pinned to a commit SHA, with the version in a comment: to update
# one, take the SHA of the new release tag.

on:
  pull_request:
    branches: [idq]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the PR to check (e.g. the Sync upstream PR)"
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  # Runs started by hand only. GitHub computes the merge ref asynchronously and
  # doesn't update it while the PR has conflicts: wait for it, refuse a
  # conflicting PR, and pass the checked merge commit to the other jobs.
  merge-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      head: ${{ steps.pr.outputs.head }}
      merge: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Find the PR head and mark the checks as pending
        id: pr
        run: |
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          for check in docker-build unit-tests upstream-files; do
            gh api "repos/$GH_REPO/statuses/$head" -f state=pending -f context="$check" -f target_url="$RUN_URL" >/dev/null
          done
          for _ in $(seq 20); do
            mergeable=$(gh pr view "$PR" --json mergeable --jq .mergeable)
            [ "$mergeable" != UNKNOWN ] && break
            sleep 5
          done
          if [ "$mergeable" != MERGEABLE ]; then
            echo "::error::PR #$PR can't be merged automatically ($mergeable): resolve the conflicts as described in .github/README.md"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/merge

      - name: Check that the merge ref is up to date with the PR head
        id: merge
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          # The merge commit's parents are idq and the PR head.
          if ! git cat-file -p HEAD | grep -qx "parent $HEAD_SHA"; then
            echo "::error::refs/pull/$PR/merge doesn't contain the PR head $HEAD_SHA yet: rerun the workflow in a minute"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: merge-ref
    # On PRs merge-ref is skipped; by hand, it must have succeeded.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.merge-ref.outputs.merge || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=idq-ci
          cache-to: type=gha,scope=idq-ci,mode=max

  unit-tests:
    needs: merge-ref
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.merge-ref.outputs.merge || github.ref }}

      # The same Node major as the Docker image (Dockerfile)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Enable pnpm
        id: pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          corepack enable
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Server unit tests
        working-directory: apps/server
        run: pnpm exec jest src/idq

      - name: Client unit tests
        working-directory: apps/client
        run: pnpm exec vitest run src/idq

  upstream-files:
    needs: merge-ref
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.merge-ref.outputs.merge || github.ref }}
          fetch-depth: 0

      # The merge base with main is a pure Docmost commit: the files that the PR
      # merge result modifies or deletes compared to it are the Docmost files we
      # change. Files we add never conflict, so they don't count.
      - name: Check which Docmost files we modify
        run: |
          list=.github/idq-upstream-files.txt
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          base=$(git merge-base origin/main HEAD)
          git diff --name-only --no-renames --diff-filter=MD "$base" HEAD | sort -u > "$RUNNER_TEMP/modified"
          sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' "$list" | sort -u > "$RUNNER_TEMP/listed"

          echo "Docmost files modified by idq with this PR (compared to docmost/docmost@${base:0:7}):"
          sed 's/^/  /' "$RUNNER_TEMP/modified"

          comm -13 "$RUNNER_TEMP/modified" "$RUNNER_TEMP/listed" | while IFS= read -r f; do
            echo "::warning file=$list::$f is listed but no longer modified: remove it from the list"
          done

          comm -23 "$RUNNER_TEMP/modified" "$RUNNER_TEMP/listed" > "$RUNNER_TEMP/unlisted"
          if [ -s "$RUNNER_TEMP/unlisted" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::Docmost file modified but not listed in $list"
            done < "$RUNNER_TEMP/unlisted"
            exit 1
          fi

  # Runs started by hand only: write each result as a status on the PR head,
  # where the ruleset looks for it.
  report:
    needs: [merge-ref, docker-build, unit-tests, upstream-files]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.merge-ref.outputs.head != '' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.merge-ref.outputs.head }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DOCKER_BUILD: ${{ needs.docker-build.result }}
      UNIT_TESTS: ${{ needs.unit-tests.result }}
      UPSTREAM_FILES: ${{ needs.upstream-files.result }}
    steps:
      - name: Write the results on the PR head
        run: |
          report() {
            state=$([ "$2" = success ] && echo success || echo failure)
            gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state="$state" -f context="$1" -f target_url="$RUN_URL" >/dev/null
          }
          report docker-build "$DOCKER_BUILD"
          report unit-tests "$UNIT_TESTS"
          report upstream-files "$UPSTREAM_FILES"
