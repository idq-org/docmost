name: CI

# Checks a PR before it goes into idq:
# - docker-build: the Docker image builds. This check is required by the idq ruleset.
# - upstream-files: we only modify the Docmost files listed in
#   .github/idq-upstream-files.txt.
#
# Both check the PR merge result, that is idq with the PR merged in. Sync upstream
# PRs opened with GITHUB_TOKEN don't trigger workflows: for those, Sync upstream
# runs this workflow by hand with the PR number, and the result is written as a
# "docker-build" status on the PR head commit.

on:
  pull_request:
    branches: [idq]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the PR to check (e.g. the Sync upstream PR)"
        type: number
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # GitHub computes the merge ref asynchronously and doesn't update it while
      # the PR has conflicts: wait for it and refuse a conflicting PR.
      - name: Find the PR head and mark it as pending
        id: pr
        if: github.event_name == 'workflow_dispatch'
        run: |
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/statuses/$sha" -f state=pending -f context=docker-build -f target_url="$RUN_URL" >/dev/null
          for _ in $(seq 20); do
            mergeable=$(gh pr view "$PR" --json mergeable --jq .mergeable)
            [ "$mergeable" != UNKNOWN ] && break
            sleep 5
          done
          if [ "$mergeable" != MERGEABLE ]; then
            echo "::error::PR #$PR can't be merged automatically ($mergeable): resolve the conflicts as described in .github/README.md"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - name: Check that the merge ref is up to date with the PR head
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # The merge commit's parents are idq and the PR head.
          if ! git cat-file -p HEAD | grep -qx "parent $HEAD_SHA"; then
            echo "::error::refs/pull/$PR/merge doesn't contain the PR head $HEAD_SHA yet: rerun the workflow in a minute"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=idq-ci
          cache-to: type=gha,scope=idq-ci,mode=max

      - name: Write the result on the PR head
        if: always() && github.event_name == 'workflow_dispatch' && steps.pr.outputs.sha != ''
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          state=$([ "${{ job.status }}" = success ] && echo success || echo failure)
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state="$state" -f context=docker-build -f target_url="$RUN_URL" >/dev/null

  upstream-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The merge base with main is a pure Docmost commit: the files that the PR
      # merge result modifies or deletes compared to it are the Docmost files we
      # change. Files we add never conflict, so they don't count.
      - name: Check which Docmost files we modify
        run: |
          list=.github/idq-upstream-files.txt
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          base=$(git merge-base origin/main HEAD)
          git diff --name-only --no-renames --diff-filter=MD "$base" HEAD | sort -u > "$RUNNER_TEMP/modified"
          sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' "$list" | sort -u > "$RUNNER_TEMP/listed"

          echo "Docmost files modified by idq with this PR (compared to docmost/docmost@${base:0:7}):"
          sed 's/^/  /' "$RUNNER_TEMP/modified"

          comm -13 "$RUNNER_TEMP/modified" "$RUNNER_TEMP/listed" | while read -r f; do
            echo "::warning file=$list::$f is listed but no longer modified: remove it from the list"
          done

          unlisted=$(comm -23 "$RUNNER_TEMP/modified" "$RUNNER_TEMP/listed")
          if [ -n "$unlisted" ]; then
            for f in $unlisted; do
              echo "::error file=$f::Docmost file modified but not listed in $list"
            done
            exit 1
          fi
