name: Deploy

# On every push to idq (except .github-only changes), updates https://app.informaticidiquartiere.org.
# On the VPS, the DEPLOY_SSH_KEY key can only run /srv/docmost/deploy.sh
# (forced command in authorized_keys), which brings /srv/docmost/src to origin/idq
# and rebuilds the containers. Secrets: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST.

on:
  push:
    branches: [idq]
    # Fork docs and workflows don't change the app: no need to rebuild it.
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'idq-org/docmost'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy to the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 "root@$HOST"
