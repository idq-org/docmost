name: Sync upstream

# Brings main up to date with docmost/docmost and, if there is anything new,
# opens a main → idq PR to be merged with a merge commit.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: read

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update main from docmost/docmost
        run: gh api -X POST "repos/$GH_REPO/merge-upstream" -f branch=main

      - name: Open the main → idq PR if idq is behind
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/idq...main" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "idq already contains all of main"
            exit 0
          fi
          open=$(gh pr list --base idq --head main --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "PR #$open is already open, main is $ahead commits ahead"
          else
            gh pr create --base idq --head main \
              --title "Update from docmost/docmost" \
              --body "main is $ahead commits ahead of idq.

          Merge with **Create a merge commit**. If there are conflicts, see the \"Updates from Docmost\" section in .github/README.md.

          Do **not** delete the main branch after the merge."
          fi

      # PRs created by the GITHUB_TOKEN don't trigger CI: we run it ourselves on main's head.
      - name: Run CI on main's head
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/idq...main" --jq .ahead_by)
          [ "$ahead" -gt 0 ] || exit 0
          sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          checked=$(gh api "repos/$GH_REPO/commits/$sha/status" --jq '[.statuses[] | select(.context == "docker-build")] | length')
          if [ "$checked" -gt 0 ]; then
            echo "CI already run on $sha"
          else
            gh workflow run idq-ci.yml --ref idq -f sha="$sha"
          fi
