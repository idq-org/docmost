name: Sync upstream

# Porta main allo stato di docmost/docmost e, se ci sono novità,
# apre una PR main → idq da unire con merge commit.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Aggiorna main da docmost/docmost
        run: gh api -X POST "repos/$GH_REPO/merge-upstream" -f branch=main

      - name: Apri la PR main → idq se idq è indietro
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/idq...main" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "idq contiene già tutto main"
            exit 0
          fi
          open=$(gh pr list --base idq --head main --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "PR #$open già aperta, main è avanti di $ahead commit"
            exit 0
          fi
          gh pr create --base idq --head main \
            --title "Aggiornamento da docmost/docmost" \
            --body "main è avanti di $ahead commit rispetto a idq.

          Unire con **Create a merge commit**. Se ci sono conflitti, vedi la sezione \"Aggiornamenti da Docmost\" in .github/README.md.

          Dopo il merge **non** cancellare il branch main."
