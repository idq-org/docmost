name: Sync upstream

# Brings main up to date with docmost/docmost and, if there is anything new,
# opens a main → idq PR to be merged with a merge commit.
#
# Token: the SYNC_TOKEN secret, a fine-grained token with Contents, Pull requests
# and Workflows read/write on this repo (see "Updates from Docmost" in
# .github/README.md). Without it the action falls back to GITHUB_TOKEN, which
# GitHub never allows to update .github/workflows: the sync then fails whenever
# Docmost changes its own workflows, and the PRs it opens don't trigger CI.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Used only by the GITHUB_TOKEN fallback.
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: read

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update main from docmost/docmost
        run: |
          if ! out=$(gh api -X POST "repos/$GH_REPO/merge-upstream" -f branch=main 2>&1); then
            echo "$out"
            if [ "$HAS_SYNC_TOKEN" != true ] && grep -q workflows <<<"$out"; then
              echo "::error::Docmost changed files in .github/workflows and GITHUB_TOKEN can't copy them. Add the SYNC_TOKEN secret (see .github/README.md), or update main by hand: gh repo sync $GH_REPO --branch main"
            fi
            exit 1
          fi
          echo "$out"

      - name: Open the main → idq PR if idq is behind
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/idq...main" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "idq already contains all of main"
            exit 0
          fi
          open=$(gh pr list --base idq --head main --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "PR #$open is already open, main is $ahead commits ahead"
          else
            gh pr create --base idq --head main \
              --title "Update from docmost/docmost" \
              --body "main is $ahead commits ahead of idq.

          Merge with **Create a merge commit**. If there are conflicts, see the \"Updates from Docmost\" section in .github/README.md.

          Do **not** delete the main branch after the merge."
          fi

      # With SYNC_TOKEN, opening the PR or pushing to main triggers CI by itself.
      # PRs and pushes made by GITHUB_TOKEN don't: start CI on the PR by hand. It
      # builds the PR merge result and writes "docker-build" on the PR head.
      - name: Run CI on the PR (GITHUB_TOKEN fallback)
        if: env.HAS_SYNC_TOKEN != 'true'
        run: |
          pr=$(gh pr list --base idq --head main --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || exit 0
          sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          state=$(gh api "repos/$GH_REPO/commits/$sha/status" --jq '[.statuses[] | select(.context == "docker-build")][0].state // ""')
          if [ "$state" = success ] || [ "$state" = pending ]; then
            echo "docker-build is already $state on $sha"
          else
            gh workflow run idq-ci.yml --ref idq -f pr="$pr"
          fi
